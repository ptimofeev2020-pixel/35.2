name: CI/CD

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

env:
  IMAGE_NAME: lms-web
  APP_DIR: lms

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: 'False'
      DB_ENGINE: django.db.backends.postgresql
      POSTGRES_DB: lms_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python manage.py test

  lint:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install flake8
        run: pip install flake8==7.3.0
      - name: Run flake8
        run: flake8 .

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:latest -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
      - name: Check image
        run: docker run --rm -e SECRET_KEY=check -e DB_ENGINE=django.db.backends.sqlite3 ${{ env.IMAGE_NAME }}:latest python manage.py check
      - name: Save image
        run: docker save ${{ env.IMAGE_NAME }}:latest | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG=False
          ALLOWED_HOSTS=${{ secrets.SSH_HOST }},localhost,127.0.0.1
          CSRF_TRUSTED_ORIGINS=http://${{ secrets.SSH_HOST }}
          DB_ENGINE=django.db.backends.postgresql
          POSTGRES_DB=lms
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/0
          STRIPE_API_KEY=${{ secrets.STRIPE_API_KEY }}
          PAYMENT_SUCCESS_URL=http://${{ secrets.SSH_HOST }}/payments/success/
          PAYMENT_CANCEL_URL=http://${{ secrets.SSH_HOST }}/payments/cancel/
          EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
          DEFAULT_FROM_EMAIL=lms@example.com
          EOF
      - name: Copy files to server
        run: |
          SSH="ssh -i ~/.ssh/id_deploy"
          TARGET=${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          $SSH $TARGET "mkdir -p ~/${{ env.APP_DIR }}/nginx"
          scp -i ~/.ssh/id_deploy image.tar.gz docker-compose.yml .env $TARGET:~/${{ env.APP_DIR }}/
          scp -i ~/.ssh/id_deploy nginx/default.conf $TARGET:~/${{ env.APP_DIR }}/nginx/
      - name: Start containers on server
        run: |
          ssh -i ~/.ssh/id_deploy ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd ~/${{ env.APP_DIR }} &&
            gunzip -c image.tar.gz | docker load &&
            rm image.tar.gz &&
            chmod 600 .env &&
            docker compose up -d --no-build --remove-orphans &&
            docker image prune -f
          "
      - name: Check application
        run: |
          sleep 15
          curl --fail --retry 5 --retry-delay 5 http://${{ secrets.SSH_HOST }}/api/docs/
